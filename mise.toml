# The single source of toolchain versions, locally and in CI (via jdx/mise-action).
# Bump versions here, then refresh mise.lock with:
#   mise lock --platform linux-x64,linux-arm64,macos-arm64,windows-x64,windows-arm64
[tools]
# Validates conventional commit messages in the commit-msg hook (lefthook.yml).
cocogitto = "7.0.0"
lefthook = "2.2.2"
# Builds the .deb and .rpm packages (scripts/package.sh); only Linux release jobs need it.
nfpm = { version = "2.49.0", os = ["linux"] }
python = "3.15.2" # scripts/release.py
rust = { version = "1.99.1", profile = "minimal", components = ["rustfmt", "clippy"] }

[settings]
lockfile = true

# Local secrets for development, such as SIMPLYMAIL_GOOGLE_CLIENT_ID and _SECRET. Gitignored; skipped
# when missing (as in CI).
[env]
_.file = ".env"
